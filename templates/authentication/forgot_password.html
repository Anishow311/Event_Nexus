{% extends "authentication/base.html" %}

{% block title %}Forgot Password - Event Nexus{% endblock %}
{% block subtitle %}Enter your email address and we'll send you a password reset link.{% endblock %}

{% block content %}
<form class="flex flex-col gap-4" method="POST" action="{% url 'forgot_password' %}">
    {% csrf_token %}
    
    <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-[#8d90a0] uppercase tracking-wider" for="email">Registered Email</label>
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8d90a0] text-[18px]">mail</span>
            <input class="w-full bg-[#1e293b]/50 border border-[#334155] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-[#64748b] outline-none input-glow" 
                   id="email" 
                   name="email" 
                   placeholder="name@college.edu" 
                   required 
                   type="email"
                   value="{{ form.email.value|default:'' }}"
                   autocomplete="email"/>
        </div>
    </div>
    
    <button class="mt-2 w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl py-3 px-4 font-semibold text-sm btn-glow flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20" type="submit">
        <span class="material-symbols-outlined text-[18px]">send</span>
        <span>Send Reset Link</span>
    </button>
</form>

<!-- Footer Switch Link -->
<div class="text-center pt-4 border-t border-[#334155]/50 flex items-center justify-center gap-1.5 text-xs text-[#8d90a0]">
    <span>Remember your password?</span>
    <a class="font-semibold text-blue-400 hover:text-blue-300 transition-colors" href="{% url 'login' %}">
        Back to Sign In
    </a>
</div>
{% endblock %}
